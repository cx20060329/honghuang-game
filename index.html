<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>洪荒神话 v4.15.0 - 深度玩法增强版</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-dark: #1a1a2e;
      --bg-card: #16213e;
      --bg-darker: #0f0f1a;
      --text-gold: #d4af37;
      --text-cream: #f5e6c8;
      --text-dim: #8b8b8b;
      --accent-red: #c41e3a;
      --accent-blue: #4a90d9;
      --border-gold: #8b7355;
    }

    body {
      font-family: "Microsoft YaHei", "SimHei", sans-serif;
      background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-darker) 100%);
      color: var(--text-cream);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* 角色选择界面 */
    #character-select {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #character-select h1 {
      font-size: 2.5em;
      color: var(--text-gold);
      text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
      margin-bottom: 10px;
    }

    #character-select .subtitle {
      color: var(--text-dim);
      margin-bottom: 30px;
    }

    .character-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      max-width: 900px;
      width: 100%;
    }

    .character-card {
      background: var(--bg-card);
      border: 1px solid var(--border-gold);
      border-radius: 10px;
      padding: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .character-card:hover {
      transform: translateY(-5px);
      border-color: var(--text-gold);
      box-shadow: 0 10px 30px rgba(212, 175, 55, 0.2);
    }

    .character-card .name {
      font-size: 1.2em;
      color: var(--text-gold);
      margin-bottom: 5px;
    }

    .character-card .title {
      font-size: 0.9em;
      color: var(--text-dim);
      margin-bottom: 10px;
    }

    .character-card .faction {
      font-size: 0.8em;
      color: var(--accent-blue);
    }

    /* 游戏主界面 */
    #game-container {
      display: none;
      min-height: 100vh;
      flex-direction: column;
    }

    /* 顶部信息栏 */
    #info-bar {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-gold);
      padding: 10px 15px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    #info-bar .character-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    #info-bar .name-title {
      color: var(--text-gold);
    }

    #info-bar .attributes {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    #info-bar .attr {
      font-size: 0.85em;
    }

    #info-bar .attr-label {
      color: var(--text-dim);
    }

    #info-bar .attr-value {
      color: var(--text-cream);
    }

    /* 剧情文本区 */
    #story-area {
      flex: 1;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }

    #story-box {
      background: var(--bg-card);
      border: 1px solid var(--border-gold);
      border-radius: 10px;
      padding: 20px;
      min-height: 300px;
    }

    #story-title {
      color: var(--text-gold);
      font-size: 1.3em;
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border-gold);
      padding-bottom: 10px;
    }

    #story-content {
      white-space: pre-wrap;
      line-height: 1.8;
    }

    /* 内心独白样式 */
    .inner-monologue {
      margin-top: 20px;
      padding: 15px 15px 15px 20px;
      margin-left: 20px;
      border-left: 3px solid var(--text-gold);
      font-style: italic;
      color: #a89070;
      font-size: 0.95em;
      line-height: 1.7;
      background: rgba(212, 175, 55, 0.05);
      border-radius: 0 8px 8px 0;
    }

    .inner-monologue-title {
      font-style: normal;
      color: var(--text-gold);
      font-size: 0.9em;
      margin-bottom: 8px;
      opacity: 0.8;
    }

    /* 选项区 */
    #choices-area {
      padding: 15px;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }

    .choice-btn {
      display: block;
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-gold);
      color: var(--text-cream);
      padding: 12px 20px;
      margin-bottom: 10px;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      transition: all 0.3s ease;
      font-size: 1em;
    }

    .choice-btn:hover:not(:disabled) {
      background: var(--bg-darker);
      border-color: var(--text-gold);
      transform: translateX(5px);
    }

    .choice-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      color: var(--text-dim);
    }

    .choice-btn .locked-hint {
      font-size: 0.8em;
      color: var(--accent-red);
    }

    /* 底部功能栏 */
    #action-bar {
      background: var(--bg-card);
      border-top: 1px solid var(--border-gold);
      padding: 10px 15px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .action-btn {
      background: transparent;
      border: 1px solid var(--border-gold);
      color: var(--text-gold);
      padding: 8px 16px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .action-btn:hover {
      background: var(--text-gold);
      color: var(--bg-dark);
    }

    /* 模态框 */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--bg-card);
      border: 1px solid var(--border-gold);
      border-radius: 10px;
      padding: 20px;
      max-width: 500px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-header {
      color: var(--text-gold);
      font-size: 1.3em;
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border-gold);
      padding-bottom: 10px;
    }

    .modal-close {
      float: right;
      cursor: pointer;
      color: var(--text-dim);
    }

    .modal-close:hover {
      color: var(--text-gold);
    }

    /* 成就列表 */
    .achievement-item {
      padding: 10px;
      border-bottom: 1px solid var(--border-gold);
    }

    .achievement-item.unlocked {
      color: var(--text-gold);
    }

    .achievement-item.locked {
      color: var(--text-dim);
    }

    /* 成就解锁通知 */
    .achievement-notification {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 10000;
      animation: slideIn 0.5s ease-out;
    }

    .achievement-toast {
      background: linear-gradient(135deg, #d4af37, #b8860b);
      color: #1a1a2e;
      padding: 15px 25px;
      border-radius: 10px;
      font-weight: bold;
      box-shadow: 0 5px 20px rgba(212, 175, 55, 0.5);
    }

    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .achievement-item .name {
      font-weight: bold;
    }

    .achievement-item .desc {
      font-size: 0.9em;
    }

    /* 结局分享 */
    #ending-share {
      text-align: center;
      padding: 20px;
    }

    #ending-share h2 {
      color: var(--text-gold);
      margin-bottom: 20px;
    }

    #share-btn {
      background: var(--text-gold);
      color: var(--bg-dark);
      border: none;
      padding: 12px 30px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1.1em;
    }

    #share-btn:hover {
      opacity: 0.9;
    }

    /* 响应式 */
    @media (max-width: 600px) {
      #character-select h1 {
        font-size: 1.8em;
      }

      .character-grid {
        grid-template-columns: 1fr;
      }

      #info-bar .attributes {
        font-size: 0.8em;
      }

      #story-box {
        padding: 15px;
      }

      .choice-btn {
        padding: 10px 15px;
      }
    }

    /* 打字机光标 */
    .typing-cursor {
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
  
    /* ===== 美化新增样式 ===== */

    /* 节点类型边框样式 */
    #story-box.milestone {
      border: 2px solid var(--text-gold);
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
    }

    #story-box.battle {
      border: 2px solid var(--accent-red);
      box-shadow: 0 0 15px rgba(196, 30, 58, 0.3);
    }

    #story-box.ending {
      border: 2px solid #9b59b6;
      box-shadow: 0 0 15px rgba(155, 89, 182, 0.3);
    }

    /* 属性变化闪烁动画 */
    @keyframes flash-green {
      0% { background-color: rgba(46, 204, 113, 0.5); }
      100% { background-color: transparent; }
    }

    @keyframes flash-red {
      0% { background-color: rgba(231, 76, 60, 0.5); }
      100% { background-color: transparent; }
    }

    .attr-value.flash-green {
      animation: flash-green 0.5s ease-out;
      color: #2ecc71 !important;
    }

    .attr-value.flash-red {
      animation: flash-red 0.5s ease-out;
      color: #e74c3c !important;
    }

    /* 章节进度灯 */
    #chapter-progress {
      display: flex;
      justify-content: center;
      gap: 15px;
      padding: 10px;
      background: var(--bg-darker);
      border-bottom: 1px solid var(--border-gold);
    }

    .chapter-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #444;
      transition: all 0.3s ease;
      position: relative;
    }

    .chapter-dot::after {
      content: attr(data-chapter);
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7em;
      color: var(--text-dim);
      white-space: nowrap;
    }

    .chapter-dot.passed {
      background: #2ecc71;
      box-shadow: 0 0 8px rgba(46, 204, 113, 0.5);
    }

    .chapter-dot.current {
      background: var(--text-gold);
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.7);
      transform: scale(1.2);
    }

    /* 结局面板美化 */
    .ending-frame {
      font-family: monospace;
      color: var(--text-gold);
      white-space: pre;
      text-align: center;
      margin: 20px 0;
      font-size: 0.9em;
      line-height: 1.4;
    }

    #ending-text {
      white-space: pre-wrap;
      line-height: 1.8;
      text-align: left;
    }

    /* 移动端优化 */
    @media (max-width: 600px) {
      .choice-btn, .action-btn {
        min-height: 44px;
        font-size: 16px;
      }

      #story-content {
        line-height: 1.8;
        font-size: 16px;
      }

      .chapter-dot::after {
        display: none;
      }

      #chapter-progress {
        gap: 20px;
      }

      .chapter-dot {
        width: 14px;
        height: 14px;
      }
    }

  
    /* ========== 深度玩法增强样式 ========== */

    /* 寿元进度条 */
    .lifespan-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 10px;
      background: rgba(0,0,0,0.3);
      border-radius: 5px;
    }
    .lifespan-bar .label {
      color: #ff9500;
      font-size: 0.85em;
    }
    .lifesspan-bar .bar-container {
      width: 80px;
      height: 8px;
      background: #333;
      border-radius: 4px;
      overflow: hidden;
    }
    .lifespan-bar .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #ff4444, #ff9500, #44ff44);
      transition: width 0.3s ease;
    }
    .lifespan-bar .value {
      color: #ff9500;
      font-size: 0.85em;
      min-width: 40px;
    }

    /* 业力值进度条 */
    .karma-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 10px;
      background: rgba(0,0,0,0.3);
      border-radius: 5px;
    }
    .karma-bar .label {
      font-size: 0.85em;
    }
    .karma-bar.good .label { color: #44ff44; }
    .karma-bar.neutral .label { color: #aaaaaa; }
    .karma-bar.evil .label { color: #ff4444; }
    .karma-bar .bar-container {
      width: 80px;
      height: 8px;
      background: #333;
      border-radius: 4px;
      overflow: hidden;
    }
    .karma-bar .bar-fill {
      height: 100%;
      transition: width 0.3s ease, background 0.3s ease;
    }
    .karma-bar.good .bar-fill { background: #44ff44; }
    .karma-bar.neutral .bar-fill { background: #aaaaaa; }
    .karma-bar.evil .bar-fill { background: #ff4444; }

    /* Debuff 提示 */
    .debuff-indicator {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      background: rgba(255, 68, 68, 0.2);
      border: 1px solid #ff4444;
      border-radius: 3px;
      font-size: 0.8em;
      color: #ff6666;
      margin-left: 5px;
    }
    .debuff-indicator.心魔反噬 { border-color: #9944ff; color: #bb66ff; background: rgba(153, 68, 255, 0.2); }
    .debuff-indicator.业火焚身 { border-color: #ff4400; color: #ff6644; background: rgba(255, 68, 0, 0.2); }

    /* 战斗结果弹窗 */
    .battle-result {
      text-align: center;
      padding: 20px;
    }
    .battle-result.victory { color: #44ff44; }
    .battle-result.defeat { color: #ff4444; }
    .battle-result .title {
      font-size: 1.5em;
      margin-bottom: 15px;
    }
    .battle-result .details {
      font-size: 0.9em;
      color: var(--text-dim);
      margin-bottom: 20px;
    }

    /* 传承选择界面 */
    #legacy-select {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    #legacy-select h2 {
      color: var(--text-gold);
      margin-bottom: 20px;
    }
    .legacy-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      max-width: 800px;
      padding: 20px;
    }
    .legacy-card {
      background: var(--bg-card);
      border: 1px solid var(--border-gold);
      border-radius: 10px;
      padding: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .legacy-card:hover {
      transform: translateY(-5px);
      border-color: var(--text-gold);
    }
    .legacy-card.selected {
      border-color: #44ff44;
      box-shadow: 0 0 15px rgba(68, 255, 68, 0.3);
    }
    .legacy-card .name {
      color: var(--text-gold);
      font-size: 1.1em;
      margin-bottom: 5px;
    }
    .legacy-card .effect {
      color: #44ff44;
      font-size: 0.9em;
    }
    .legacy-card .description {
      color: var(--text-dim);
      font-size: 0.85em;
      margin-top: 8px;
    }

    /* 随机事件弹窗 */
    .random-event-popup {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border: 2px solid var(--text-gold);
      animation: eventPulse 0.5s ease;
    }
    @keyframes eventPulse {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .random-event-popup .event-type {
      font-size: 0.9em;
      padding: 3px 10px;
      border-radius: 3px;
      margin-bottom: 10px;
      display: inline-block;
    }
    .random-event-popup .event-type.positive { background: rgba(68, 255, 68, 0.2); color: #44ff44; }
    .random-event-popup .event-type.negative { background: rgba(255, 68, 68, 0.2); color: #ff4444; }
    .random-event-popup .event-type.neutral { background: rgba(170, 170, 170, 0.2); color: #aaaaaa; }

    /* 修炼冷却提示 */
    .cultivation-cooldown {
      color: var(--text-dim);
      font-size: 0.85em;
      margin-top: 5px;
    }

    /* 战斗力显示 */
    .combat-power {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      background: rgba(255, 215, 0, 0.1);
      border: 1px solid var(--border-gold);
      border-radius: 3px;
    }
    .combat-power .icon { color: var(--text-gold); }
    .combat-power .value { color: var(--text-cream); font-weight: bold; }

    </style>
</head>
<body>
  <!-- 角色选择界面 -->
  <div id="character-select">
    <h1>洪荒神话</h1>
    <p class="subtitle">选择你的命运</p>
    <div class="character-grid" id="character-grid"></div>
  </div>

  <!-- 游戏主界面 -->
  <div id="game-container">
    
    <!-- 章节进度灯 -->
    <div id="chapter-progress">
      <div class="chapter-dot" data-chapter="龙汉初劫" data-phase="dragon_phoenix_war"></div>
      <div class="chapter-dot" data-chapter="道魔之战" data-phase="dao_demon_war"></div>
      <div class="chapter-dot" data-chapter="紫霄宫讲道" data-phase="hongjun_lecture"></div>
      <div class="chapter-dot" data-chapter="巫妖崛起" data-phase="wu_yao_rise"></div>
      <div class="chapter-dot" data-chapter="巫妖决战" data-phase="wu_yao_final"></div>
    </div>

    <div id="info-bar">
      <div class="character-info">
        <div class="name-title">
          <span id="char-name">角色名</span>
          <span id="char-title">称号</span>
        </div>
        <div class="attributes">
          <span class="attr"><span class="attr-label">根脚:</span> <span id="attr-genjiao" class="attr-value">0</span></span>
          <span class="attr"><span class="attr-label">气运:</span> <span id="attr-qiyun" class="attr-value">0</span></span>
          <span class="attr"><span class="attr-label">道行:</span> <span id="attr-daohang" class="attr-value">0</span></span>
          <span class="attr"><span class="attr-label">声望:</span> <span id="attr-shengwang" class="attr-value">0</span></span>
          <span class="attr"><span class="attr-label">心性:</span> <span id="attr-xinxing" class="attr-value">0</span></span>
        </div>
      </div>
    </div>

    <div id="story-area">
      <div id="story-box">
        <div id="story-title">章节标题</div>
        <div id="story-content">剧情内容</div>
      </div>
    </div>

    <div id="choices-area"></div>

    <div id="action-bar">
      <button class="action-btn" onclick="showSaveModal()">存档</button>
      <button class="action-btn" onclick="showLoadModal()">读档</button>
      <button class="action-btn" onclick="showAttributesModal()">属性</button>
      <button class="action-btn" onclick="showAchievementsModal()">成就</button>
    </div>
  </div>

  <!-- 存档模态框 -->
  <div class="modal" id="save-modal">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-close" onclick="closeModal('save-modal')">×</span>
        存档
      </div>
      <div id="save-slots"></div>
    </div>
  </div>

  <!-- 读档模态框 -->
  <div class="modal" id="load-modal">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-close" onclick="closeModal('load-modal')">×</span>
        读档
      </div>
      <div id="load-slots"></div>
    </div>
  </div>

  <!-- 属性模态框 -->
  <div class="modal" id="attributes-modal">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-close" onclick="closeModal('attributes-modal')">×</span>
        角色属性
      </div>
      <div id="attributes-detail"></div>
    </div>
  </div>

  <!-- 成就模态框 -->
  <div class="modal" id="achievements-modal">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-close" onclick="closeModal('achievements-modal')">×</span>
        成就 (<span id="achievement-count">0</span>/<span id="achievement-total">0</span>)
      </div>
      <div id="achievements-list"></div>
    </div>
  </div>

  <!-- 结局分享 -->
  <div class="modal" id="ending-modal">
    <div class="modal-content">
      <div id="ending-share">
        <h2 id="ending-title">结局标题</h2>
        <p id="ending-text"></p>
        <button id="share-btn" onclick="shareEnding()">分享你的洪荒故事</button>
      </div>
    </div>
  </div>

      "content": "分宝岩上，宝光四溢，瑞气千条。\n\n鸿钧道祖立于混沌原石之上，大袖一挥——无数先天灵宝如同星辰般从岩中飞出，在虚空中划出一道道璀璨的光痕！\n\n「诛仙四剑与阵图，传予通天。」鸿钧的声音虚无缥缈，「此乃盘古封印、罗睺解封之天道第一杀器。杀伐虽重，慎用之。」\n\n四柄神剑带着凛冽的杀意落入通天教主手中。通天欣喜若狂，剑身上的煞气与他那锋芒毕露的道韵完美共鸣。\n\n「乾坤鼎，传予女娲。」——那是乾坤老祖的遗物，鼎身上还残留着道魔之战的斑驳痕迹。女娲双手接过，眼中闪过一丝悲悯。\n\n「太极图，传予老子。」——阴阳老祖以性命催动的至宝，如今安静地悬浮在老子掌心，黑白二气缓缓旋转。\n\n「盘古幡，传予元始天尊。」——盘古斧刃所化，攻伐第一。元始天尊神色沉稳地接过，周身气势为之一振。\n\n两千多听道之人各凭机缘，或得灵宝，或空手而归。剩余的宝物化作流光散落洪荒，等待有缘之人。\n\n你虽未能得到那些顶级至宝，但也在此次分宝中有所收获——一块蕴含着大道碎片的造化玉碟残片，落入你的手中。",

      "chapter": "第三章·紫霄宫讲道",
      "phase": "hongjun_lecture",
      "type": "milestone",
      "title": "三次讲道",
      "milestone": "milestone_third_lecture",
      "content": "分宝岩的喧嚣散去之后，紫霄宫恢复了宁静。但所有人心中都明白——这最后一次讲道，才是真正决定命运的时刻。\n\n鸿钧道祖的面容比前两次更加深邃，那双眼睛仿佛已经看透了时间的长河。\n\n「第三次讲道，吾讲的是——成圣之道。」\n\n所有人都屏住了呼吸。成圣！这是整个洪荒所有修士追求的终极目标！\n\n「成圣之路，共有三条。」\n\n「第一条路——以力证道。以自身之力强行破开天道桎梏，不借外物，不假他人。此法最强，也最难。盘古大神走的是这条路，所以他失败了。但他失败的开天之举，却创造了洪荒。」\n\n「第二条路——斩三尸证道。将三尸尽数斩去，以纯净本源合道。此法为吾所行之路。修此法者，需以先天灵宝寄托三尸——灵宝品级越高，斩尸越彻底。」\n\n「第三条路——功德证道。以无量大功德感动天道，天道降下圣位。此法最易入门的，却也最难圆满。功德不足，终是伪圣；功德圆满，方为真圣。」\n\n三清互相看了一眼——他们三人乃是盘古元神所化，天生就有开天功德护体，走功德证道之路大有可能。但老子和元始对视一眼，眼中另有一层深意——以力证道的诱惑，谁能拒绝？\n\n女娲低头沉思——她做过的每一件事，造人、补天，都是功德。第三条路，仿佛就是为她量身定做的。\n\n准提和接引面露愁容——西方贫瘠，他们能拿什么来积累功德？\n\n「成圣之后，元神寄托天道，万劫不灭。」鸿钧缓缓说道，「但圣人有圣人的约束——天道在你身，你亦在天道之中。从此之后，一举一动，皆须顺应天道大势。」\n\n这话如同冷水浇头。原来成圣，也意味着失去一部分自由。\n\n鸿钧沉默了片刻，然后说出了一句更重要的话——\n\n「老子、元始、通天、女娲、接引、准提——汝六人有缘，吾收汝等为亲传弟子和记名弟子。」\n\n六人上前拜师。鸿钧赐予他们每人一道鸿蒙紫气——那是混沌初开时遗留下来的大道本源，是成圣之基。\n\n全场鸦雀无声。两千多听道者看着这六人，目光中有羡慕、有嫉妒、有叹息，也有暗藏杀机。红云老祖看着自己手中的鸿蒙紫气——那是他唯一的依仗，也是他今后灾祸的根源。\n\n第三次讲道，持续了整整一千年。\n\n当鸿钧从高台上起身时，所有人都知道——一个时代结束了。紫霄宫讲道的时代结束了。而接下来，是各凭本事、各争圣位的时代。",

    // 计算战斗力
    function calculateCombatPower() {
      const daohang = gameState.attributes.daohang || 50;
      const genjiao = gameState.attributes.genjiao || 50;
      gameState.combatPower = Math.floor((daohang + genjiao) / 2);
      return gameState.combatPower;
    }

    // 消耗寿元
    function consumeLifespan(years) {
      gameState.lifespan -= years;
      if (gameState.lifespan <= 0) {
        gameState.lifespan = 0;
        triggerLifespanEnd();
      }
      updateUI();
      return gameState.lifespan;
    }

    function checkKarmaDebuffs() {
      // 清除旧的业力debuff
      gameState.activeDebuffs = gameState.activeDebuffs.filter(d =>
        d !== '心魔反噬' && d !== '业火焚身'
      );

      if (gameState.karma >= 30) {
        gameState.activeDebuffs.push('业火焚身');
        // 应用业火焚身效果
        gameState.attributes.daohang = Math.max(0, (gameState.attributes.daohang || 50) - 25);
        gameState.attributes.qiyun = Math.max(0, (gameState.attributes.qiyun || 50) - 20);
        gameState.attributes.genjiao = Math.max(0, (gameState.attributes.genjiao || 50) - 10);
      } else if (gameState.karma >= 15) {
        gameState.activeDebuffs.push('心魔反噬');
        // 应用心魔反噬效果
        gameState.attributes.daohang = Math.max(0, (gameState.attributes.daohang || 50) - 15);
        gameState.attributes.qiyun = Math.max(0, (gameState.attributes.qiyun || 50) - 10);
      }
    }

    // 战斗判定
    function resolveBattle(node) {
      const threshold = node.combatThreshold || 60;
      const power = calculateCombatPower();

      let winChance = 0.70; // 基础胜率70%
      if (power >= threshold) {
        winChance += Math.min(0.25, (power - threshold) / 10 * 0.05); // 每10点+5%，最高95%
      }
      winChance = Math.min(0.95, winChance);

      const roll = Math.random();
      const victory = roll < winChance;

      return {
        victory,
        power,
        threshold,
        winChance: Math.floor(winChance * 100),
        roll: Math.floor(roll * 100)
      };
    }

    // 处理战斗节点

      const result = resolveBattle(node);

        gameState.attributes.daohang = (gameState.attributes.daohang || 50) + 5;
        gameState.attributes.shengwang = (gameState.attributes.shengwang || 50) + 10;
        consumeLifespan(3);

        // 添加战斗胜利buff
        addBuff('buff_battle_victory', 3);

        gameState.attributes.daohang = Math.max(0, (gameState.attributes.daohang || 50) - 10);
        gameState.attributes.qiyun = Math.max(0, (gameState.attributes.qiyun || 50) - 15);
        consumeLifespan(5);

        // 触发命悬一线
        await triggerNearDeath(node);

      updateUI();

        const card = document.createElement('div');
        card.className = 'legacy-card';
        card.onclick = () => {

          <div class="effect">${legacy.effect}</div>
          <div class="description">${legacy.description}</div>

      });

      // 如果没有解锁的传承，显示默认选项
      if (gameState.unlockedLegacies.length === 0) {
        LEGACY_MARKS.slice(0, 3).forEach(legacy => {
          const card = document.createElement('div');
          card.className = 'legacy-card';
          card.onclick = () => {

    }

    function startNewGameWithLegacy() {
      if (gameState.legacyBonus) {
        // 应用传承效果
        const effect = gameState.legacyBonus.effect;
        if (effect.includes('+')) {
          const [attr, value] = effect.split('+');
          if (attr === 'lifespan') {
            gameState.lifespan += parseInt(value);
            gameState.maxLifespan += parseInt(value);
          } else {
            gameState.attributes[attr] = (gameState.attributes[attr] || 50) + parseInt(value);
          }
        } else if (effect.includes('-')) {
          const [attr, value] = effect.split('-');
          gameState.karma -= parseInt(value);
        }
      }

      document.getElementById('legacy-select').style.display = 'none';
      document.getElementById('character-select').style.display = 'flex';
    }

    function skipLegacy() {
      gameState.legacyBonus = null;
      document.getElementById('legacy-select').style.display = 'none';
      document.getElementById('character-select').style.display = 'flex';
    }

    // 解锁传承印记
    function unlockLegacy(achievementId) {
      const legacyMap = {
        'ach_ending_fall': 'legacy_qiyun',
        'ach_ending_seclusion': 'legacy_genjiao',
        'ach_ending_dominate': 'legacy_daohang',
        'ach_hidden_ending': 'legacy_sage',
        'ach_demon_path': 'legacy_demon'
      };

      const legacyId = legacyMap[achievementId];
      if (legacyId && !gameState.unlockedLegacies.includes(legacyId)) {
        gameState.unlockedLegacies.push(legacyId);
        saveLegacyData();
      }
    }


    function init() {
      renderCharacterSelect();
      loadAutoSave();
    }

    // ==================== 角色选择 ====================
    function renderCharacterSelect() {
      const grid = document.getElementById('character-grid');
      grid.innerHTML = '';

      GAME_DATA.characters.forEach(char => {
        const card = document.createElement('div');
        card.className = 'character-card';

    function selectCharacter(charId) {
      const char = GAME_DATA.characters.find(c => c.id === charId);
      if (!char) return;

      gameState.character = char;
      gameState.currentNodeId = 'node_phase1_start';
      gameState.attributes = {};
      gameState.items = char.startingItems ? [...char.startingItems] : [];
      gameState.relationships = {};
      gameState.flags = {};
      gameState.achievements = [];
      gameState.history = [];
      // v4.15.0 深度玩法
      gameState.lifespan = 100;
      gameState.maxLifespan = 100;
      gameState.karma = 0;
      gameState.combatPower = 10;
      gameState.activeDebuffs = [];
      gameState.activeBuffs = [];
      gameState.cultivationCooldown = 0;
      gameState.cultivationCount = 0;
      gameState.legacyBonus = 0;
      gameState.randomEventCooldown = 0;
      gameState.timestamp = 0;
      gameState.unlockedLegacies = [];

      // 初始化属性
      for (const [name, config] of Object.entries(char.attributes)) {
        gameState.attributes[name] = config.default;
      }

      // 初始化关系
      if (char.startingRelationships) {
        char.startingRelationships.forEach(rel => {
          gameState.relationships[rel.characterId] = rel.value;
        });
      }

      // 切换到游戏界面
      document.getElementById('character-select').style.display = 'none';
      document.getElementById('game-container').style.display = 'flex';

      updateUI();
      loadNode(gameState.currentNodeId);
    }

    
    async function loadNode(nodeId) {
      const node = GAME_DATA.storyNodes.find(n => n.id === nodeId);
      if (!node) {
        console.error('节点不存在:', nodeId);
        return;
      }

      gameState.currentNodeId = nodeId;
      gameState.history.push(nodeId);

      // 减少修炼冷却
      if (gameState.cultivationCooldown > 0) {
        gameState.cultivationCooldown--;
      }

      // 根据节点类型消耗寿元
      if (node.type === 'milestone') {
        consumeLifespan(5);
      } else if (node.type === 'battle') {
        consumeLifespan(3);
      }

      // 应用节点效果
      if (node.effects) {
        applyEffects(node.effects);
      }

      // 更新UI
      updateUI();

      // 显示剧情 - 等待打字完成
      await displayStory(node);

      // 检查寿元
      if (gameState.lifespan <= 0) {
        return;
      }

      // 处理战斗节点
      if (node.type === 'battle') {
        await handleBattleNode(node);
      }

      // 检查结局
      if (node.type === 'ending') {
        showEnding(node);
        return;
      }

      // 处理自动跳转
      if (node.autoNextId) {
        const content = node.content || '';
        const bufferTime = Math.min(2000, Math.max(500, content.length * 8));
        setTimeout(() => loadNode(node.autoNextId), bufferTime);
        return;
      }

      // 尝试触发随机事件（在游历类选项后）
      if (nodeId.includes('travel') || nodeId.includes('wander') || nodeId.includes('neutral')) {
        const event = tryTriggerRandomEvent();
        if (event) {
          await handleRandomEvent(event);
        }
      }

      // 显示选项
      displayChoices(node);
    }


    // ==================== 剧情显示 ====================
    function displayStory(node) {
      return new Promise((resolve) => {
        const titleEl = document.getElementById('story-title');
        const contentEl = document.getElementById('story-content');
        const storyBox = document.getElementById('story-box');

        // 根据节点类型设置样式和标题前缀
        storyBox.classList.remove('milestone', 'battle', 'ending');
        let titlePrefix = '';

        switch (node.type) {
          case 'milestone':
            storyBox.classList.add('milestone');
            titlePrefix = '⭐ ';
            break;
          case 'battle':
            storyBox.classList.add('battle');
            titlePrefix = '⚔️ ';
            break;
          case 'ending':
            storyBox.classList.add('ending');
            titlePrefix = '🏁 ';
            break;
        }

        titleEl.textContent = titlePrefix + (node.title || '');

        // 更新章节进度灯
        updateChapterProgress(node.phase);

        // 清除之前的内心独白
        currentInnerMonologue = null;

        // 处理动态内容（内心独白）
        if (node.dynamicContent && gameState.character) {
          const dynamicItem = node.dynamicContent.find(dc => {
            if (dc.characterId && dc.characterId !== gameState.character.id) return false;
            if (dc.characterTag) {
              const tags = gameState.character.role_tags || [];
              if (!tags.includes(dc.characterTag)) return false;
            }
            return true;
          });
          if (dynamicItem && dynamicItem.innerMonologue) {
            currentInnerMonologue = dynamicItem.innerMonologue;
          }
        }

        const content = node.content || '';

        // 如果内容为空，直接resolve
        if (!content) {
          contentEl.innerHTML = '';
          resolve();
          return;
        }

        // 打字机效果 - 使用 requestAnimationFrame + TextNode，消除闪烁
        contentEl.innerHTML = '';
        contentEl.style.whiteSpace = 'pre-wrap';

        const textNode = document.createTextNode('');
        contentEl.appendChild(textNode);

        const cursor = document.createElement('span');
        cursor.className = 'typing-cursor';
        cursor.textContent = '▌';
        contentEl.appendChild(cursor);

        let index = 0;
        const totalChars = content.length;
        const charsPerFrame = Math.ceil(totalChars / 150); // 约150帧完成，保证流畅
        let lastTime = 0;
        const targetInterval = 16; // 约60fps

        function typeWriter(currentTime) {
          if (index < totalChars) {
            // 控制帧率
            if (currentTime - lastTime >= targetInterval) {
              const end = Math.min(index + charsPerFrame, totalChars);
              textNode.textContent = content.substring(0, end);
              index = end;
              lastTime = currentTime;
            }
            requestAnimationFrame(typeWriter);
          } else {
            // 打字完成
            cursor.remove();

            // 显示内心独白
            if (currentInnerMonologue) {
              contentEl.innerHTML = content + `
                <div class="inner-monologue">
                  <div class="inner-monologue-title">💭 内心独白</div>
                  ${currentInnerMonologue}
                </div>
              `;
            } else {
              contentEl.innerHTML = content;
            }

            // 打字完成，resolve Promise
            resolve();
          }
        }

        requestAnimationFrame(typeWriter);
      });
    }

    // 更新章节进度灯
    function updateChapterProgress(currentPhase) {
      const phases = ['dragon_phoenix_war', 'dao_demon_war', 'hongjun_lecture', 'wu_yao_rise', 'wu_yao_final'];
      const currentIndex = phases.indexOf(currentPhase);

      document.querySelectorAll('.chapter-dot').forEach((dot, index) => {
        dot.classList.remove('passed', 'current');
        if (index < currentIndex) {
          dot.classList.add('passed');
        } else if (index === currentIndex) {
          dot.classList.add('current');
        }
      });
    }

    // ==================== 选项显示 ====================
    function displayChoices(node) {
      const choicesArea = document.getElementById('choices-area');
      choicesArea.innerHTML = '';

      if (!node.choices || node.choices.length === 0) {
        return;
      }

      node.choices.forEach((choice, index) => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';

        const available = checkConditions(choice.conditions);
        btn.disabled = !available;
        btn.textContent = choice.text;

        if (!available && choice.conditions) {
          const hints = choice.conditions.map(c => getConditionHint(c)).filter(h => h);
          if (hints.length > 0) {
            btn.innerHTML = `${choice.text} <span class="locked-hint">[${hints.join(', ')}]</span>`;
          }
        }

        btn.onclick = () => selectChoice(choice);
        choicesArea.appendChild(btn);
      });
    }

    function selectChoice(choice) {
      // 应用选项效果
      if (choice.effects) {
        applyEffects(choice.effects);
      }

      // 跳转到下一节点
      if (choice.nextNodeId) {
        loadNode(choice.nextNodeId);
      }
    }

    // ==================== 条件检查 ====================
    function checkConditions(conditions) {
      if (!conditions || conditions.length === 0) return true;

      for (const cond of conditions) {
        switch (cond.type) {
          case 'attribute':
            const attrValue = gameState.attributes[cond.target] || 0;
            if (!compare(attrValue, cond.operator, cond.value)) return false;
            break;
          case 'item':
            const hasItem = gameState.items.includes(cond.target);
            if (cond.operator === 'has' && !hasItem) return false;
            if (cond.operator === 'not_has' && hasItem) return false;
            break;
          case 'flag':
            const flagValue = gameState.flags[cond.target];
            if (!compare(flagValue, cond.operator, cond.value)) return false;
            break;
          case 'character':
            if (cond.target !== gameState.character.id) return false;
            break;
          case 'role_tag':
            const hasTag = gameState.character.role_tags && gameState.character.role_tags.includes(cond.target);
            if (cond.operator === 'has_tag' && !hasTag) return false;
            if (cond.operator === 'has_not_tag' && hasTag) return false;
            break;
        }
      }

      return true;
    }

    function compare(a, op, b) {
      switch (op) {
        case '>=': return (a || 0) >= b;
        case '<=': return (a || 0) <= b;
        case '==': return a == b;
        case '!=': return a != b;
        case '>': return (a || 0) > b;
        case '<': return (a || 0) < b;
        case 'has': return !!a;
        case 'not_has': return !a;
        default: return false;
      }
    }

    function getConditionHint(cond) {
      switch (cond.type) {
        case 'attribute':
          const current = gameState.attributes[cond.target] || 0;
          return `${cond.target}需要${cond.value} (当前${current})`;
        case 'item':
          return cond.operator === 'has' ? `需要物品: ${cond.target}` : '';
        case 'flag':
          return `需要条件`;
        case 'character':
          return `角色限制`;
        case 'role_tag':
          return `需要身份: ${cond.target}`;
        default:
          return '';
      }
    }

    // ==================== 效果应用 ====================
    // 存储当前节点的内心独白
    let currentInnerMonologue = null;

    function applyEffects(effects) {
      if (!effects) return;

      for (const effect of effects) {
        switch (effect.type) {
          case 'attribute_change':
            const current = gameState.attributes[effect.target] || 0;
            gameState.attributes[effect.target] = Math.max(0, Math.min(100, current + effect.value));
            break;
          case 'add_item':
            if (!gameState.items.includes(effect.target)) {
              gameState.items.push(effect.target);
            }
            break;
          case 'remove_item':
            const idx = gameState.items.indexOf(effect.target);
            if (idx > -1) gameState.items.splice(idx, 1);
            break;
          case 'set_flag':
            gameState.flags[effect.target] = effect.value;
            // 设置flag后检查成就
            checkAndUnlockAchievements();
            break;
          case 'addAchievement':
          case 'unlock_achievement':
            if (!gameState.achievements.includes(effect.target)) {
              gameState.achievements.push(effect.target);
              const ach = GAME_DATA.achievements ? GAME_DATA.achievements.find(a => a.id === effect.target) : null;
              if (ach) showAchievementNotification(ach);
            }
            break;
          case 'dynamic_content':
            // 处理角色专属内心独白
            if (effect.contents && gameState.character) {
              const charId = gameState.character.id;
              if (effect.contents[charId]) {
                currentInnerMonologue = effect.contents[charId];
              }
            }
            break;
        }
      }

      updateUI();
      autoSave();
    }

    // ==================== UI更新 ====================
    // 存储旧属性值用于比较
    let oldAttributes = {};

    // 属性名到DOM元素ID的映射
    const attrMap = {
      daohang: 'attr-daohang',
      genjiao: 'attr-genjiao',
      qiyun: 'attr-qiyun',
      shengwang: 'attr-shengwang',
      xinxing: 'attr-xinxing'
    };

      gameState.activeDebuffs.forEach(d => {

      // 寿元百分比

      const lifespanColor = lifespanPercent > 50 ? '#44ff44' : lifespanPercent > 25 ? '#ff9500' : '#ff4444';

      // 业力值显示

      infoBar.innerHTML = `
        <div class="character-info">
          <div class="name-title">

            ${debuffHtml}
          </div>
          <div class="attributes">
            <div class="attr"><span class="attr-label">道行:</span> <span id="attr-daohang" class="attr-value">${attr.daohang || 50}</span></div>
            <div class="attr"><span class="attr-label">根脚:</span> <span id="attr-genjiao" class="attr-value">${attr.genjiao || 50}</span></div>
            <div class="attr"><span class="attr-label">气运:</span> <span id="attr-qiyun" class="attr-value">${attr.qiyun || 50}</span></div>
            <div class="attr"><span class="attr-label">声望:</span> <span id="attr-shengwang" class="attr-value">${attr.shengwang || 50}</span></div>
            <div class="attr"><span class="attr-label">心性:</span> <span id="attr-xinxing" class="attr-value">${attr.xinxing || 50}</span></div>
            <div class="combat-power"><span class="icon">⚔️</span><span class="value">${gameState.combatPower}</span></div>
          </div>
        </div>
        <div class="character-info" style="margin-top: 8px;">
          <div class="lifespan-bar">
            <span class="label">🕐 寿元:</span>
            <div class="bar-container">

            </div>
            <span class="value">${gameState.lifespan}/${gameState.maxLifespan}年</span>
          </div>
          <div class="karma-bar ${karmaClass}">
            <span class="label">☯️ 业力:</span>
            <div class="bar-container">
              <div class="bar-fill" style="width: ${Math.min(100, gameState.karma * 3)}%;"></div>
            </div>
            <span class="value">${gameState.karma}</span>

      // 更新修炼冷却显示

      for (const [attr, elementId] of Object.entries(attrMap)) {

        // 移除旧的闪烁类
        el.classList.remove('flash-green', 'flash-red');

        // 如果值变化了，添加闪烁效果
        if (newValue > oldValue) {
          el.classList.add('flash-green');
        } else if (newValue < oldValue) {
          el.classList.add('flash-red');

      }

      // 更新旧属性值
      oldAttributes = { ...gameState.attributes };
    }

    // ==================== 属性详情 ====================
    function showAttributesModal() {
      const detail = document.getElementById('attributes-detail');
      detail.innerHTML = `
        <div style="margin-bottom: 10px;"><strong>角色:</strong> ${gameState.character?.name || '未选择'}</div>
        <div style="margin-bottom: 10px;"><strong>称号:</strong> ${gameState.character?.title || ''}</div>
        <div style="margin-bottom: 10px;"><strong>阵营:</strong> ${gameState.character?.faction || ''}</div>
        <hr style="border-color: var(--border-gold); margin: 10px 0;">
        <div style="margin-bottom: 5px;"><strong>根脚:</strong> ${gameState.attributes.genjiao || 0}</div>
        <div style="margin-bottom: 5px;"><strong>气运:</strong> ${gameState.attributes.qiyun || 0}</div>
        <div style="margin-bottom: 5px;"><strong>道行:</strong> ${gameState.attributes.daohang || 0}</div>
        <div style="margin-bottom: 5px;"><strong>声望:</strong> ${gameState.attributes.shengwang || 0}</div>
        <div style="margin-bottom: 5px;"><strong>心性:</strong> ${gameState.attributes.xinxing || 0}</div>
        <hr style="border-color: var(--border-gold); margin: 10px 0;">
        <div><strong>物品:</strong> ${gameState.items.length > 0 ? gameState.items.join(', ') : '无'}</div>
      `;
      document.getElementById('attributes-modal').classList.add('active');
    }

    // ==================== 成就 ====================
    // 检查并解锁成就
    function checkAndUnlockAchievements() {
      if (!GAME_DATA.achievements) return;

      for (const ach of GAME_DATA.achievements) {
        if (gameState.achievements.includes(ach.id)) continue;

        const cond = ach.condition;
        let unlocked = false;

        switch (cond.type) {
          case 'flag':
            if (gameState.flags[cond.target] === cond.value) {
              unlocked = true;
            }
            break;
          case 'attribute':
            const attrValue = gameState.attributes[cond.target] || 0;
            if (compare(attrValue, cond.operator, cond.value)) {
              if (cond.requireFlag && gameState.flags[cond.requireFlag] !== true) {
                continue;
              }
              unlocked = true;
            }
            break;
          case 'item':
            if (cond.operator === 'has' && gameState.items.includes(cond.target)) {
              unlocked = true;
            }
            break;
          case 'relationship':
            const relValue = gameState.relationships[cond.target] || 0;
            if (compare(relValue, cond.operator, cond.value)) {
              unlocked = true;
            }
            break;
          case 'ending':
            // 检查是否到达特定结局
            if (gameState.flags['flag_game_complete'] && gameState.history.includes(cond.target)) {
              unlocked = true;
            }
            break;
          case 'character':
            // 检查是否用特定角色通关
            if (gameState.flags['flag_game_complete'] && gameState.character && gameState.character.id === cond.target) {
              unlocked = true;
            }
            break;
        }

        if (unlocked) {
          gameState.achievements.push(ach.id);
          showAchievementNotification(ach);
        }
      }
    }

    // 显示成就解锁通知
    function showAchievementNotification(ach) {
      const notification = document.createElement('div');
      notification.className = 'achievement-notification';
      notification.innerHTML = `
        <div class="achievement-toast">
          🏆 成就解锁: ${ach.name}
        </div>
      `;
      document.body.appendChild(notification);

      // 3秒后自动消失
      setTimeout(() => {
        notification.remove();
      }, 3000);
    }

    // 比较函数
    function compare(value, operator, target) {
      switch (operator) {
        case '>=': return value >= target;
        case '<=': return value <= target;
        case '>': return value > target;
        case '<': return value < target;
        case '==': return value === target;
        case '!=': return value !== target;
        default: return false;
      }
    }

    function showAchievementsModal() {
      // 打开面板时主动检查成就条件
      checkAndUnlockAchievements();

      const list = document.getElementById('achievements-list');
      list.innerHTML = '';

      let unlocked = 0;
      GAME_DATA.achievements.forEach(ach => {
        const isUnlocked = gameState.achievements.includes(ach.id);
        if (isUnlocked) unlocked++;

        const item = document.createElement('div');
        item.className = 'achievement-item ' + (isUnlocked ? 'unlocked' : 'locked');
        item.innerHTML = `
          <div class="name">${isUnlocked ? '🏆 ' : '🔒 '}${ach.name}</div>
          <div class="desc">${ach.description}</div>
        `;
        list.appendChild(item);
      });

      document.getElementById('achievement-count').textContent = unlocked;
      document.getElementById('achievement-total').textContent = GAME_DATA.achievements.length;
      document.getElementById('achievements-modal').classList.add('active');
    }

    // ==================== 模态框控制 ====================
    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    // 点击模态框外部关闭
    document.querySelectorAll('.modal').forEach(modal => {
      modal.addEventListener('click', (e) => {
        if (e.target === modal) {
          modal.classList.remove('active');
        }
      });
    });

    // ==================== 启动游戏 ====================
    init();
  </script>

    <!-- 周目传承选择界面 -->
    <div id="legacy-select">
      <h2>🌟 选择传承印记</h2>
      <p style="color: var(--text-dim); margin-bottom: 20px;">选择一项成就作为下一局的传承加成</p>
      <div class="legacy-grid" id="legacy-grid"></div>
      <div style="margin-top: 20px;">
        <button class="action-btn" onclick="startNewGameWithLegacy()">开始新周目</button>
        <button class="action-btn" onclick="skipLegacy()">跳过传承</button>
      </div>
    </div>

  
    <!-- 战斗结果弹窗 -->
    <div class="modal" id="battle-modal">
      <div class="modal-content" id="battle-modal-content"></div>
    </div>

    <!-- 随机事件弹窗 -->
    <div class="modal" id="event-modal">
      <div class="modal-content" id="event-modal-content"></div>
    </div>

    <!-- 对话弹窗 -->
    <div class="modal" id="dialog-modal">
      <div class="modal-content" id="dialog-modal-content">
        <p id="dialog-text"></p>
        <button class="action-btn" onclick="closeDialogModal()">确定</button>
      </div>
    </div>
